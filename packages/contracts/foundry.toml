[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 1
via_ir = true
fs_permissions = [{ access = "read", path = "./" }]

# Los tests de fork se seleccionan por path: forge test --match-path "test/fork/*" --rpc-url robinhood
[rpc_endpoints]
robinhood = "${RH_RPC_MAINNET}"
robinhood_testnet = "${RH_RPC_TESTNET}"

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
