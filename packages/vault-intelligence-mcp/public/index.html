<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Nuvem Vault Intelligence MCP</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: #f5f5f5;
        background: #090909;
      }
      body {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 32px;
        place-items: center;
      }
      main {
        width: min(680px, 100%);
        padding: 32px;
        border: 1px solid #2b2b2b;
        background: #111;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(28px, 6vw, 48px);
        line-height: 1;
      }
      p {
        color: #b8b8b8;
        line-height: 1.6;
      }
      code, a {
        color: #8cff9b;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 28px;
      }
      a {
        padding: 10px 14px;
        border: 1px solid #3c3c3c;
        text-decoration: none;
      }
      a:hover {
        border-color: #8cff9b;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Nuvem Vault Intelligence</h1>
      <p>
        Read-only, Graph-backed MCP for Robinhood Chain vault provenance,
        holdings, performance and policy-aware trade simulation.
      </p>
      <p>Streamable HTTP endpoint: <code>POST /mcp</code></p>
      <nav aria-label="Service checks">
        <a href="/healthz">Process health</a>
        <a href="/readyz">Graph readiness</a>
      </nav>
    </main>
  </body>
</html>
